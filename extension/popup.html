<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0;
    }
    h1 { font-size: 16px; margin: 0 0 12px; color: #00d4ff; }
    .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.on { background: #00ff88; }
    .dot.off { background: #ff4444; }
    label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #16213e;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    input.token {
      font-family: monospace;
      font-size: 12px;
    }
    button {
      width: 100%;
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #1a4080;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #1a4080; }
    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>NetCaptor</h1>
  <div class="status-row">
    <div class="dot off" id="dot"></div>
    <span id="statusText">Disconnected</span>
  </div>
  <label>Server URL</label>
  <input type="text" id="serverUrl" placeholder="ws://localhost:3000" />
  <label>API Token</label>
  <input type="password" id="apiToken" class="token" placeholder="Paste token from server output" />
  <button id="saveBtn">Save & Connect</button>
  <div class="hint">
    The token is printed when the server starts. It prevents websites from accessing your local server.
  </div>
  <script src="popup.js"></script>
</body>
</html>
